<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viral Product Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-2: #22263a;
    --border: #2e3350;
    --text: #e8eaf6;
    --muted: #7b82a8;
    --accent: #4f7ef8;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100dvh;
    padding: 24px 16px 64px;
  }

  header {
    max-width: 1200px;
    margin: 0 auto 32px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header h1 span { color: var(--accent); }

  #meta {
    font-size: 0.8rem;
    color: var(--muted);
    margin-left: auto;
  }

  .filters {
    max-width: 1200px;
    margin: 0 auto 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filters label { font-size: 0.8rem; color: var(--muted); }

  .filters select, .filters input {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.85rem;
    outline: none;
  }

  .filters select:focus, .filters input:focus {
    border-color: var(--accent);
  }

  #grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.15s, transform 0.15s;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card-img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: contain;
    background: var(--surface-2);
    padding: 12px;
  }

  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    color: var(--border);
  }

  .card-body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .card-name {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-category {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .stat-label {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
  }

  .stat-value {
    font-size: 0.9rem;
    font-weight: 700;
  }

  .stat-value.good { color: var(--green); }
  .stat-value.warn { color: var(--yellow); }
  .stat-value.na   { color: var(--muted); font-weight: 400; }

  .score-bar {
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), #a855f7);
    transition: width 0.4s ease;
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-label {
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .score-num {
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 700;
    margin-left: auto;
    white-space: nowrap;
  }

  .card-links {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }

  .btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.15s;
    border: none;
    cursor: pointer;
  }

  .btn:hover { opacity: 0.8; }
  .btn-amazon { background: #ff9900; color: #000; }
  .btn-cj { background: var(--accent); color: #fff; }
  .btn-disabled { background: var(--surface-2); color: var(--muted); cursor: default; }

  #empty {
    max-width: 1200px;
    margin: 64px auto;
    text-align: center;
    color: var(--muted);
    display: none;
  }

  #loading {
    max-width: 1200px;
    margin: 64px auto;
    text-align: center;
    color: var(--muted);
  }

  .rank-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.7);
    color: var(--green);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    backdrop-filter: blur(4px);
  }

  .card-img-wrap { position: relative; }

  @media (max-width: 480px) {
    #grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Viral <span>Product</span> Tracker</h1>
  <div id="meta">Loading...</div>
</header>

<div class="filters">
  <label>Category</label>
  <select id="filterCat">
    <option value="">All Categories</option>
  </select>

  <label style="margin-left:8px">Min Score</label>
  <input type="number" id="filterScore" value="0" min="0" max="200" style="width:70px">

  <label style="margin-left:8px">Sort</label>
  <select id="sortBy">
    <option value="virality_score">Virality Score</option>
    <option value="rank_change_pct">Amazon Momentum</option>
    <option value="trend_score">Google Trends</option>
    <option value="cj_price">CJ Price (low)</option>
  </select>
</div>

<div id="loading">Fetching today's viral products...</div>
<div id="empty">No products match your filters.</div>
<div id="grid"></div>

<script>
let ALL_PRODUCTS = [];

function scoreColor(score) {
  if (score >= 120) return 'good';
  if (score >= 60) return 'warn';
  return 'na';
}

function marginColor(margin) {
  if (margin === 'N/A') return 'na';
  const low = parseInt(margin);
  if (low >= 30) return 'good';
  if (low >= 15) return 'warn';
  return 'na';
}

function formatPrice(p) {
  if (p == null) return 'N/A';
  return '$' + parseFloat(p).toFixed(2);
}

function formatMomentum(pct) {
  if (!pct) return 'N/A';
  return '+' + pct.toLocaleString() + '%';
}

function renderCard(p, rank) {
  const scoreBarWidth = Math.min((p.virality_score / 200) * 100, 100).toFixed(1);

  const imgHtml = p.cj_image_url
    ? `<img class="card-img" src="${p.cj_image_url}" alt="${p.name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=card-img-placeholder>📦</div>'">`
    : `<div class="card-img-placeholder">📦</div>`;

  const amazonBtn = p.url
    ? `<a class="btn btn-amazon" href="${p.url}" target="_blank" rel="noopener">Amazon</a>`
    : `<span class="btn btn-disabled">Amazon</span>`;

  const cjBtn = p.cj_product_id
    ? `<a class="btn btn-cj" href="https://app.cjdropshipping.com/productList.html#/productDetail?pid=${p.cj_product_id}" target="_blank" rel="noopener">CJ Source</a>`
    : `<span class="btn btn-disabled">No CJ Match</span>`;

  return `
    <div class="card" data-category="${p.category}" data-score="${p.virality_score}">
      <div class="card-img-wrap">
        ${imgHtml}
        <div class="rank-badge">#${rank} Today</div>
      </div>
      <div class="card-body">
        <div>
          <div class="card-category">${p.category}</div>
          <div class="card-name">${p.name}</div>
        </div>

        <div class="score-row">
          <span class="score-label">Virality Score</span>
          <div class="score-bar" style="flex:1">
            <div class="score-fill" style="width:${scoreBarWidth}%"></div>
          </div>
          <span class="score-num">${p.virality_score}/200</span>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Amazon +</div>
            <div class="stat-value good">${formatMomentum(p.rank_change_pct)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Google Trend</div>
            <div class="stat-value ${scoreColor(p.trend_score * 2)}">${p.trend_score || 'N/A'}/100</div>
          </div>
          <div class="stat">
            <div class="stat-label">CJ Cost</div>
            <div class="stat-value">${formatPrice(p.cj_price)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Est. Margin</div>
            <div class="stat-value ${marginColor(p.estimated_margin)}">${p.estimated_margin}</div>
          </div>
        </div>

        ${p.cj_shipping_days ? `<div style="font-size:0.75rem;color:var(--muted)">CJ ships in ${p.cj_shipping_days} days</div>` : ''}

        <div class="card-links">
          ${amazonBtn}
          ${cjBtn}
        </div>
      </div>
    </div>
  `;
}

function applyFilters() {
  const cat = document.getElementById('filterCat').value;
  const minScore = parseFloat(document.getElementById('filterScore').value) || 0;
  const sortKey = document.getElementById('sortBy').value;

  let filtered = ALL_PRODUCTS.filter(p => {
    if (cat && p.category !== cat) return false;
    if (p.virality_score < minScore) return false;
    return true;
  });

  filtered.sort((a, b) => {
    if (sortKey === 'cj_price') {
      return (a.cj_price || 999) - (b.cj_price || 999);
    }
    return (b[sortKey] || 0) - (a[sortKey] || 0);
  });

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = filtered.map((p, i) => renderCard(p, i + 1)).join('');
  }
}

async function loadData() {
  try {
    const res = await fetch('products.json?t=' + Date.now());
    if (!res.ok) throw new Error('products.json not found');
    const data = await res.json();

    ALL_PRODUCTS = data.products || [];

    const date = new Date(data.generated_at);
    document.getElementById('meta').textContent =
      `Updated ${date.toLocaleDateString()} ${date.toLocaleTimeString()} — ${data.total_scanned} scanned, ${ALL_PRODUCTS.length} shown`;

    document.getElementById('loading').style.display = 'none';

    // Populate category filter
    const cats = [...new Set(ALL_PRODUCTS.map(p => p.category))].sort();
    const sel = document.getElementById('filterCat');
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      sel.appendChild(opt);
    });

    applyFilters();
  } catch (e) {
    document.getElementById('loading').textContent =
      'Could not load products.json — run the scraper first.';
    console.error(e);
  }
}

document.getElementById('filterCat').addEventListener('change', applyFilters);
document.getElementById('filterScore').addEventListener('input', applyFilters);
document.getElementById('sortBy').addEventListener('change', applyFilters);

loadData();
</script>
</body>
</html>
